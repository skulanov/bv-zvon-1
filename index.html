<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Электронная звонница: игра на колоколах с клавиатуры или мышью.">
    <title>Электронная звонница</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23e6be03'/%3E%3Cpolygon points='10,8 22,8 26,26 6,26' fill='%2314110d'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend+Zetta&family=Ruslan+Display&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Развес колоколов задан в style.css в единой координатной сетке 1330x900,
     которая целиком масштабируется под размер окна. -->
<main class="stage">

    <span class="label" data-label="podzvony">Подзвоны</span>
    <span class="label" data-label="zazvony">Зазвоны</span>
    <span class="label" data-label="blagovestniki">Благовестники</span>

    <kbd class="bell bell-dark" data-note="A" aria-label="Подзвон A">A</kbd>
    <kbd class="bell bell-dark" data-note="S" aria-label="Подзвон S">S</kbd>
    <kbd class="bell bell-dark" data-note="D" aria-label="Подзвон D">D</kbd>

    <kbd class="bell bell-dark" data-note="Q" aria-label="Подзвон Q">Q</kbd>
    <kbd class="bell bell-dark" data-note="W" aria-label="Подзвон W">W</kbd>
    <kbd class="bell bell-dark" data-note="E" aria-label="Подзвон E">E</kbd>

    <kbd class="bell bell-dark" data-note="X" aria-label="Подзвон X">X</kbd>
    <kbd class="bell bell-dark" data-note="Z" aria-label="Подзвон Z">Z</kbd>
    <kbd class="bell bell-dark" data-note="C" aria-label="Подзвон C">C</kbd>

    <kbd class="bell bell-dark" data-note="I" aria-label="Зазвон I">I</kbd>
    <kbd class="bell bell-dark" data-note="O" aria-label="Зазвон O">O</kbd>
    <kbd class="bell bell-dark" data-note="P" aria-label="Зазвон P">P</kbd>

    <kbd class="bell bell-gold" data-note="M" aria-label="Благовестник M">M</kbd>
    <kbd class="bell bell-gold" data-note="N" aria-label="Благовестник N">N</kbd>
    <kbd class="bell bell-gold" data-note="V" aria-label="Благовестник V">V</kbd>
    <kbd class="bell bell-gold" data-note="B" aria-label="Благовестник B">B</kbd>

</main>

<script src="index.js"></script>
</body>
</html>
